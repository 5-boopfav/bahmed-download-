name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils cmake ninja-build

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"

      - name: Build QuickJS-NG for Android ARM64
        run: |
          git clone --depth 1 https://github.com/quickjs-ng/quickjs.git quickjs-ng

          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          cmake -S quickjs-ng -B quickjs-ng/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

          cmake --build quickjs-ng/build --target qjs --parallel 2

          mkdir -p src/assets/bin/arm64-v8a
          cp quickjs-ng/build/qjs src/assets/bin/arm64-v8a/qjs

          file src/assets/bin/arm64-v8a/qjs

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.1.2

      - name: Build Android APK
        run: |
          flet build apk --yes --verbose --project "VideoDownloader" --description "Social Media Downloader"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Upload QuickJS binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-arm64
          path: src/assets/bin/arm64-v8a/qjs
          if-no-files-found: error
